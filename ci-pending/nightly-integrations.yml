name: Nightly integrations
# Live checks against real services. Kept out of PR gating so a flaky third party cannot block merges.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: integrations   # holds GEMINI_API_KEY etc.; add secrets here, never in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Gemini model check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "No key configured; skipping."; exit 0; fi
          python scripts/check_model.py --provider gemini
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              ...context.repo,
              title: 'Nightly integration check failed',
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
